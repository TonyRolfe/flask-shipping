name: pytest

on:
  push:
    branches: [master, feat/orders-tracking]
  pull_request:

jobs:
  shipment-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned stack
        run: |
          python -m pip install --upgrade pip
          grep -v '^psycopg2' requirements.txt > /tmp/req.txt
          pip install -r /tmp/req.txt \
            "Flask==2.2.5" \
            "Flask-SQLAlchemy==2.5.1" \
            "Werkzeug==2.2.3" \
            "itsdangerous==2.0.1" \
            "Jinja2==3.1.4" \
            "MarkupSafe==2.1.5" \
            "WTForms==2.2.1" \
            pytest
      - name: Shipment model and API tests
        run: python -m pytest tests/test_shipment.py tests/test_shipment_api.py -q
